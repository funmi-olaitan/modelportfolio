<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Funmi Olaitan | Model & Creative</title>

  <meta
    name="description"
    content="Official portfolio of Funmi Olaitan, model and creative based in Toronto, Canada."
  >

  <meta property="og:title" content="Funmi Olaitan | Model & Creative">
  <meta
    property="og:description"
    content="Official portfolio of Funmi Olaitan."
  >
  <meta property="og:image" content="hero1.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://funmiolaitan.com">

  <meta name="theme-color" content="#ffffff">

  <style>
    :root {
      --black: #111111;
      --white: #ffffff;
      --grey: #777777;
      --light-grey: #eeeeee;
      --nav-height: 64px;
      --side-space: clamp(20px, 4vw, 64px);
    }

    /* ==========================================
       RESET
    ========================================== */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--nav-height);
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.locked {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    ::selection {
      background: #111;
      color: #fff;
    }

    /* ==========================================
       HERO
    ========================================== */

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 650px;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.28) 100%
        ),
        url("hero1.jpg") center center / cover no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      color: white;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 24px;
      animation: heroIn 1.2s ease both;
    }

    .hero h1 {
      font-size: clamp(4.4rem, 10vw, 9rem);
      font-weight: 300;
      letter-spacing: clamp(5px, 0.8vw, 12px);
      line-height: 0.88;
      text-transform: uppercase;
    }

    .hero-subtitle {
      margin-top: 26px;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .hero-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 40px;
      min-width: 130px;
      padding: 13px 30px;

      border: 1px solid rgba(255, 255, 255, 0.8);
      color: white;
      text-decoration: none;

      font-size: 0.66rem;
      letter-spacing: 0.19em;
      text-transform: uppercase;

      transition:
        background 0.35s ease,
        color 0.35s ease,
        transform 0.35s ease;
    }

    .hero-enter:hover {
      background: white;
      color: black;
      transform: translateY(-2px);
    }

    .hero-scroll {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;

      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .hero-scroll-line {
      width: 1px;
      height: 35px;
      background: rgba(255, 255, 255, 0.7);
      animation: scrollLine 1.8s ease-in-out infinite;
      transform-origin: top;
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scrollLine {
      0%,
      100% {
        transform: scaleY(0.35);
        opacity: 0.4;
      }

      50% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    /* ==========================================
       MAIN NAVIGATION
    ========================================== */

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 100;

      width: 100%;
      height: var(--nav-height);
      padding: 0 var(--side-space);

      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 40px;

      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-logo {
      text-decoration: none;
      text-transform: uppercase;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(24px, 3.5vw, 60px);
    }

    .nav-links a {
      position: relative;
      color: var(--black);
      text-decoration: none;

      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      transition: opacity 0.3s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -8px;

      width: 100%;
      height: 1px;
      background: var(--black);

      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s ease;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav-links a.active {
      opacity: 0.5;
    }

    .nav-social {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .nav-social a {
      text-decoration: none;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .nav-social a:hover {
      opacity: 0.5;
    }

    /* ==========================================
       SHARED SECTION ELEMENTS
    ========================================== */

    main {
      width: 100%;
      overflow: hidden;
    }

    section {
      width: 100%;
    }

    .section-heading {
      max-width: 1600px;
      margin: 0 auto 30px;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
    }

    .section-kicker {
      display: block;
      margin-bottom: 8px;

      color: var(--grey);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .section-heading h2 {
      font-size: clamp(1.3rem, 2vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .section-number {
      color: var(--grey);
      font-size: 0.63rem;
      letter-spacing: 0.12em;
    }

    /* ==========================================
       HEADSHOTS
    ========================================== */

    .portfolio-section {
      min-height: calc(100svh - var(--nav-height));
      padding:
        clamp(45px, 6vw, 90px)
        var(--side-space)
        clamp(70px, 8vw, 120px);
    }

    .portfolio-layout {
      width: 100%;
      max-width: 1600px;
      margin: auto;

      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(12px, 1.5vw, 24px);

      align-items: stretch;
    }

    .portfolio-image {
      position: relative;
      overflow: hidden;
      background: #f4f4f4;
      cursor: zoom-in;
    }

    .portfolio-image img {
      width: 100%;
      height: clamp(550px, 72vh, 900px);
      object-fit: cover;

      transition:
        transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.5s ease;
    }

    .portfolio-image:hover img {
      transform: scale(1.018);
    }

    .image-number {
      position: absolute;
      left: 18px;
      bottom: 16px;

      color: white;
      font-size: 0.62rem;
      letter-spacing: 0.1em;

      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.3);
    }

    .gallery-tools {
      max-width: 1600px;
      margin: 20px auto 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .side-links {
      display: flex;
      align-items: center;
      gap: 18px;

      color: var(--grey);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .side-links a,
    .side-links button {
      border: 0;
      background: none;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      padding: 0;
    }

    .side-links a:hover,
    .side-links button:hover {
      color: var(--black);
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      border: 0;
      background: none;
      cursor: pointer;

      color: var(--grey);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .view-all:hover {
      color: var(--black);
    }

    .grid-icon {
      width: 14px;
      height: 14px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
    }

    .grid-icon span {
      display: block;
      background: currentColor;
    }

    /* ==========================================
       EDITORIAL COLLAGE
    ========================================== */

    .editorial-section {
      position: relative;

      min-height: 100svh;
      padding:
        clamp(80px, 10vw, 150px)
        var(--side-space);

      background: #f5f3ef;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .editorial-inner {
      position: relative;
      width: min(1200px, 100%);
      height: min(720px, 75vw);
      min-height: 600px;
    }

    .editorial-label {
      position: absolute;
      top: 0;
      left: 0;

      color: var(--grey);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .editorial-image {
      position: absolute;
      overflow: hidden;
      cursor: zoom-in;

      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
      background: #ddd;

      transition:
        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        z-index 0s;
    }

    .editorial-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .editorial-image.left {
      width: 32%;
      height: 74%;

      left: 8%;
      top: 17%;

      transform: rotate(-7deg);
      z-index: 1;
    }

    .editorial-image.center {
      width: 34%;
      height: 78%;

      left: 34%;
      top: 8%;

      z-index: 3;
    }

    .editorial-image.right {
      width: 31%;
      height: 72%;

      right: 7%;
      top: 19%;

      transform: rotate(6deg);
      z-index: 2;
    }

    .editorial-image.left:hover {
      transform: rotate(-4deg) translateY(-8px) scale(1.015);
      z-index: 5;
    }

    .editorial-image.center:hover {
      transform: translateY(-8px) scale(1.015);
      z-index: 5;
    }

    .editorial-image.right:hover {
      transform: rotate(3deg) translateY(-8px) scale(1.015);
      z-index: 5;
    }

    /* ==========================================
       FULL BODY
    ========================================== */

    .fullbody-section {
      background: white;
    }

    /* ==========================================
       ABOUT
    ========================================== */

    .about-section {
      min-height: 86svh;

      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);

      border-top: 1px solid var(--light-grey);
    }

    .about-title {
      padding: clamp(70px, 9vw, 150px) var(--side-space);

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      border-right: 1px solid var(--light-grey);
    }

    .about-title h2 {
      font-size: clamp(3rem, 7vw, 7rem);
      font-weight: 300;
      line-height: 0.92;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .about-title-small {
      color: var(--grey);
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .about-content {
      padding:
        clamp(70px, 9vw, 150px)
        clamp(30px, 7vw, 120px);

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .about-intro {
      max-width: 700px;

      font-size: clamp(1.25rem, 2.2vw, 2rem);
      font-weight: 300;
      line-height: 1.45;
      letter-spacing: -0.015em;
    }

    .about-description {
      max-width: 580px;
      margin-top: 40px;

      color: #4a4a4a;
      font-size: 0.9rem;
      line-height: 1.9;
    }

    .contact-grid {
      margin-top: 70px;
      padding-top: 25px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px 50px;

      border-top: 1px solid var(--light-grey);
    }

    .contact-item small {
      display: block;
      margin-bottom: 9px;

      color: var(--grey);
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .contact-item a,
    .contact-item span {
      color: var(--black);
      text-decoration: none;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .contact-item a {
      position: relative;
    }

    .contact-item a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;

      width: 100%;
      height: 1px;
      background: #111;

      transform: scaleX(0);
      transform-origin: right;

      transition: transform 0.3s ease;
    }

    .contact-item a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ==========================================
       FULLSCREEN GALLERY
    ========================================== */

    .fullscreen-gallery {
      position: fixed;
      inset: 0;
      z-index: 1000;

      width: 100%;
      height: 100svh;

      background: white;
      overflow-y: auto;
      overflow-x: hidden;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .fullscreen-gallery.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .fullscreen-header {
      position: sticky;
      top: 0;
      z-index: 10;

      width: 100%;
      min-height: 68px;
      padding: 0 var(--side-space);

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .fullscreen-logo {
      justify-self: start;

      color: var(--black);
      text-decoration: none;

      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .fullscreen-header h2 {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .close-gallery {
      justify-self: end;

      border: none;
      background: transparent;
      cursor: pointer;

      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .close-gallery:hover {
      opacity: 0.45;
    }

    .all-photos {
      width: 100%;
      padding:
        clamp(20px, 3vw, 48px)
        var(--side-space)
        80px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 1.5vw, 24px);
    }

    .all-photos img {
      width: 100%;
      height: min(75vh, 850px);
      object-fit: cover;
      cursor: zoom-in;
      background: #f3f3f3;

      transition: opacity 0.3s ease;
    }

    .all-photos img:hover {
      opacity: 0.94;
    }

    /* ==========================================
       FULLSCREEN SLIDER
    ========================================== */

    .slider-wrap {
      position: relative;

      width: 100%;
      height: calc(100svh - 68px);

      display: none;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .slider-wrap.active {
      display: flex;
    }

    #sliderImage {
      max-width: min(82vw, 1250px);
      max-height: 82vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;

      width: 70px;
      height: 100px;

      border: none;
      background: transparent;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Georgia, serif;
      font-size: 3rem;
      font-weight: 300;

      cursor: pointer;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .slider-arrow:hover {
      opacity: 0.45;
    }

    .slider-arrow.left {
      left: 2vw;
    }

    .slider-arrow.right {
      right: 2vw;
    }

    .slider-count {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);

      color: var(--grey);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
    }

    .back-to-grid {
      position: absolute;
      left: var(--side-space);
      bottom: 20px;

      border: none;
      background: transparent;

      color: var(--grey);
      cursor: pointer;

      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .back-to-grid:hover {
      color: black;
    }

    /* ==========================================
       LIGHTBOX
    ========================================== */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1500;

      width: 100%;
      height: 100svh;

      background: rgba(255, 255, 255, 0.985);

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

      opacity: 1;
      visibility:
